; PlatformIO config for the bench tests on an ESP32 DevKit (ESP32-WROOM-32).
; Pick a test in the status bar (env:lcd_test / env:servo_test / env:full_bench), then Upload.

[platformio]
default_envs = lcd_test

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.0
    madhephaestus/ESP32Servo @ ^3.0.5
extra_scripts = pre:pio_sketch.py

[env:lcd_test]
custom_sketch_dir = pumpkin_bench_tests/1_lcd_test

[env:servo_test]
custom_sketch_dir = pumpkin_bench_tests/2_servo_test

[env:full_bench]
custom_sketch_dir = pumpkin_bench_tests/3_full_bench
