; PlatformIO config for the pumpkin on an ESP32 DevKit (ESP32-WROOM-32).
; Pick an environment in the status bar (env:pumpkin = main firmware, the others are bench tests), then Upload.

[platformio]
default_envs = pumpkin

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.0
    madhephaestus/ESP32Servo @ ^3.0.5
extra_scripts = pre:pio_sketch.py

[env:pumpkin]
custom_sketch_dir = pumpkin_firmware
monitor_echo = yes      ; show what you type
monitor_eol = LF

[env:lcd_test]
custom_sketch_dir = pumpkin_bench_tests/1_lcd_test

[env:servo_test]
custom_sketch_dir = pumpkin_bench_tests/2_servo_test

[env:full_bench]
custom_sketch_dir = pumpkin_bench_tests/3_full_bench

[env:zero_test]
custom_sketch_dir = pumpkin_bench_tests/4_zero_test
monitor_echo = yes      ; show what you type
monitor_eol = LF

[env:accel_test]
custom_sketch_dir = pumpkin_bench_tests/5_accel_test
monitor_echo = yes
monitor_eol = LF
